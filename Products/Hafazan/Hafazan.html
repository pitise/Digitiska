<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hafazan Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1e8;
    --bg-alt:#ffffff;
    --card-bg:#ffffff;
    --text:#20232e;
    --muted:#6b7280;
    --accent:#b8862f;
    --accent-strong:#8a6417;
    --accent2:#3b6fd6;
    --star:#e0a500;
    --success:#178a4c;
    --success-bg:#e6f6ed;
    --practice:#a15c00;
    --practice-bg:#fdf0dc;
    --border:#e4e0d4;
    --locked:#c7c2b3;
    --shadow: 0 2px 10px rgba(30,20,0,0.08);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0f24;
      --bg-alt:#121735;
      --card-bg:#161c3f;
      --text:#eef0fb;
      --muted:#9aa3c8;
      --accent:#f6c358;
      --accent-strong:#ffd982;
      --accent2:#7fb8ff;
      --star:#ffd35c;
      --success:#4ade8a;
      --success-bg:#123424;
      --practice:#ffb454;
      --practice-bg:#3a2a10;
      --border:#262d57;
      --locked:#333a63;
      --shadow: 0 4px 18px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.05) 0, transparent 40%),
      radial-gradient(circle at 82% 8%, rgba(255,255,255,0.04) 0, transparent 35%),
      radial-gradient(circle at 60% 70%, rgba(255,255,255,0.03) 0, transparent 45%);
  }
  #app{
    max-width:560px;
    margin:0 auto;
    padding:20px 16px 60px;
    min-height:100vh;
  }
  .arabic{
    font-family:'Amiri', 'Traditional Arabic', serif;
    direction:rtl;
    unicode-bidi:isolate;
  }
  h1,h2,h3{margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .hidden{display:none !important;}

  /* ---------- Header ---------- */
  .top-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .greeting{
    font-size:1.5rem;
    font-weight:800;
  }
  .greeting .sub{
    display:block;
    font-size:0.85rem;
    font-weight:600;
    color:var(--muted);
    margin-top:2px;
  }
  .stats-pill{
    display:flex;
    gap:10px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:8px 14px;
    box-shadow:var(--shadow);
    font-weight:700;
    font-size:0.9rem;
    white-space:nowrap;
  }

  /* ---------- Term / Surah cards ---------- */
  .term-block{margin-bottom:22px;}
  .term-title{
    font-size:0.95rem;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:0 2px 10px;
  }
  .surah-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:14px;
  }
  .surah-badge{
    font-size:2rem;
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    border-radius:14px;
    flex-shrink:0;
  }
  .surah-info{flex:1;min-width:0;}
  .surah-names{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .surah-en{font-weight:800;font-size:1.05rem;}
  .surah-ar{font-size:1.2rem;color:var(--accent);}
  .surah-meaning{
    font-size:0.8rem;
    color:var(--muted);
    margin-top:1px;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:999px;
    background:var(--bg);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--star));
    border-radius:999px;
    transition:width .4s ease;
  }
  .progress-label{font-size:0.75rem;color:var(--muted);font-weight:700;white-space:nowrap;}
  .surah-arrow{
    font-size:1.3rem;
    color:var(--muted);
    flex-shrink:0;
  }
  .surah-card.complete{border-color:var(--star);}
  .surah-card.locked{opacity:0.55;}

  /* ---------- Galaxy footer ---------- */
  .galaxy-box{
    margin-top:26px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .galaxy-box h3{font-size:0.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;}
  .galaxy-row{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;}
  .galaxy-stat{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .galaxy-stat .num{font-size:1.6rem;font-weight:800;}
  .galaxy-stat .lab{font-size:0.75rem;color:var(--muted);font-weight:700;}

  /* ---------- Screen header bar (batch list / learn / check) ---------- */
  .screen-bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .back-btn{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px;
    width:42px;height:42px;
    font-size:1.2rem;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    color:var(--text);
  }
  .screen-title{flex:1;}
  .screen-title h2{font-size:1.15rem;font-weight:800;}
  .screen-title .sub{font-size:0.8rem;color:var(--muted);font-weight:700;}

  /* ---------- Batch list ---------- */
  .batch-row{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .batch-row.locked{opacity:0.5;}
  .batch-icon{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;
    background:var(--bg);
    flex-shrink:0;
  }
  .batch-icon.done{background:var(--success-bg);color:var(--success);}
  .batch-icon.current{background:var(--accent);color:#fff;}
  .batch-icon.locked-icon{color:var(--locked);}
  .batch-text{flex:1;}
  .batch-text .label{font-weight:800;font-size:0.95rem;}
  .batch-text .range{font-size:0.78rem;color:var(--muted);font-weight:600;}
  .batch-cta{
    font-size:0.8rem;font-weight:800;color:var(--accent2);
    background:none;
  }

  /* ---------- Learn card ---------- */
  .dots-row{display:flex;justify-content:center;gap:8px;margin-bottom:16px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--locked);}
  .dot.active{background:var(--accent);width:22px;border-radius:6px;}
  .dot.done{background:var(--success);}

  .ayah-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:22px;
    padding:26px 20px;
    box-shadow:var(--shadow);
    text-align:center;
    margin-bottom:16px;
  }
  .ayah-chip{
    display:inline-block;
    background:var(--bg);
    color:var(--muted);
    font-weight:800;
    font-size:1rem;
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .ayah-arabic{
    font-size:clamp(2.1rem, 7.8vw, 3rem);
    line-height:2;
    margin-bottom:14px;
  }
  .ayah-translit{
    font-size:1.25rem;
    color:var(--accent-strong);
    font-style:italic;
    margin-bottom:10px;
  }
  .ayah-en{
    font-size:1.25rem;
    color:var(--muted);
    line-height:1.5;
  }

  .btn{
    width:100%;
    padding:15px;
    border-radius:16px;
    font-weight:800;
    font-size:1rem;
    margin-bottom:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);color:#241a00;}
  .btn-secondary{background:var(--card-bg);border:1px solid var(--border);color:var(--text);}
  .btn-ghost{background:none;color:var(--accent2);font-weight:700;}
  .btn-toggle{background:var(--practice-bg);color:var(--practice);}
  .btn-repeat-active{background:var(--accent);color:#241a00;}
  .btn-success{background:var(--success);color:#04220f;}
  .btn-warn{background:var(--practice-bg);color:var(--practice);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{margin-bottom:0;}

  .nav-row{display:flex;gap:10px;margin-top:6px;}
  .nav-row .btn{flex:1;}

  /* ---------- Recitation check ---------- */
  .mini-ayah{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .mini-ayah .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .mini-ayah .n{font-size:1rem;font-weight:800;color:var(--muted);}
  .mini-play{
    background:var(--bg);
    border-radius:999px;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
    font-size:0.95rem;
  }
  .mini-ayah .ayah-arabic{font-size:1.7rem;margin-bottom:8px;text-align:right;line-height:1.9;}
  .mini-ayah .ayah-translit{font-size:1.1rem;margin-bottom:4px;}
  .mini-ayah .ayah-en{font-size:1.1rem;text-align:left;}

  .instruction-box{
    background:var(--practice-bg);
    color:var(--practice);
    border-radius:16px;
    padding:14px 16px;
    font-weight:700;
    font-size:0.9rem;
    text-align:center;
    margin-bottom:16px;
  }

  /* ---------- Celebration overlay ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .celebration-card{
    background:var(--card-bg);
    border-radius:24px;
    padding:32px 24px;
    text-align:center;
    max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
  }
  .celebration-emoji{font-size:3.2rem;margin-bottom:10px;}
  .celebration-title{font-size:1.2rem;font-weight:800;margin-bottom:6px;}
  .celebration-sub{font-size:0.9rem;color:var(--muted);margin-bottom:18px;line-height:1.4;}

  .toast{
    position:fixed;
    bottom:24px;left:50%;
    transform:translateX(-50%);
    background:var(--card-bg);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:12px 18px;
    border-radius:14px;
    font-weight:700;
    font-size:0.88rem;
    max-width:90%;
    text-align:center;
    z-index:60;
  }

  .settings-btn{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px;
    width:42px;height:42px;
    font-size:1.15rem;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    color:var(--text);
    flex-shrink:0;
  }
  .pin-input{
    width:100%;
    text-align:center;
    font-size:1.6rem;
    letter-spacing:0.5em;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    margin-bottom:12px;
  }
  .pin-error{
    color:var(--danger, #dc2626);
    font-size:0.85rem;
    font-weight:700;
    margin-bottom:10px;
    min-height:1.1em;
  }

  .footnote{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:28px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const QURAN_DATA = [{"number": 89, "arabicName": "سُورَةُ الفَجۡرِ", "englishName": "Al-Fajr", "meaning": "The Dawn", "term": 1, "badge": "🌅", "ayahCount": 30, "ayahs": [{"n": 1, "ar": "وَٱلْفَجْرِ", "en": "By the dawn", "tl": "Wal-Fajr", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5994.mp3"}, {"n": 2, "ar": "وَلَيَالٍ عَشْرٍۢ", "en": "And [by] ten nights", "tl": "Wa layaalin 'ashr", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5995.mp3"}, {"n": 3, "ar": "وَٱلشَّفْعِ وَٱلْوَتْرِ", "en": "And [by] the even [number] and the odd", "tl": "Wash shaf'i wal watr", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5996.mp3"}, {"n": 4, "ar": "وَٱلَّيْلِ إِذَا يَسْرِ", "en": "And [by] the night when it passes,", "tl": "Wallaili izaa yasr", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5997.mp3"}, {"n": 5, "ar": "هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ", "en": "Is there [not] in [all] that an oath [sufficient] for one of perception?", "tl": "Hal fee zaalika qasamul lizee hijr", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5998.mp3"}, {"n": 6, "ar": "أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ", "en": "Have you not considered how your Lord dealt with 'Aad -", "tl": "Alam tara kaifa fa'ala rabbuka bi'aad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5999.mp3"}, {"n": 7, "ar": "إِرَمَ ذَاتِ ٱلْعِمَادِ", "en": "[With] Iram - who had lofty pillars,", "tl": "Iramaa zaatil 'imaad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6000.mp3"}, {"n": 8, "ar": "ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ", "en": "The likes of whom had never been created in the land?", "tl": "Allatee lam yukhlaq misluhaa fil bilaad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6001.mp3"}, {"n": 9, "ar": "وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ", "en": "And [with] Thamud, who carved out the rocks in the valley?", "tl": "Wa samoodal lazeena jaabus sakhra bil waad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6002.mp3"}, {"n": 10, "ar": "وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ", "en": "And [with] Pharaoh, owner of the stakes? -", "tl": "Wa fir'awna zil awtaad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6003.mp3"}, {"n": 11, "ar": "ٱلَّذِينَ طَغَوْا۟ فِى ٱلْبِلَٰدِ", "en": "[All of] whom oppressed within the lands", "tl": "Allazeena taghaw fil bilaad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6004.mp3"}, {"n": 12, "ar": "فَأَكْثَرُوا۟ فِيهَا ٱلْفَسَادَ", "en": "And increased therein the corruption.", "tl": "Fa aksaroo feehal fasaad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6005.mp3"}, {"n": 13, "ar": "فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ", "en": "So your Lord poured upon them a scourge of punishment.", "tl": "Fasabba 'alaihim Rabbuka sawta 'azaab", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6006.mp3"}, {"n": 14, "ar": "إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ", "en": "Indeed, your Lord is in observation.", "tl": "Inna Rabbaka labil mirsaad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6007.mp3"}, {"n": 15, "ar": "فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ", "en": "And as for man, when his Lord tries him and [thus] is generous to him and favors him, he says, \"My Lord has honored me.\"", "tl": "Fa ammal insaanu izaa mab talaahu Rabbuhoo fa akramahoo wa na' 'amahoo fa yaqoolu Rabbeee akraman", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6008.mp3"}, {"n": 16, "ar": "وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّىٓ أَهَٰنَنِ", "en": "But when He tries him and restricts his provision, he says, \"My Lord has humiliated me.\"", "tl": "Wa ammaaa izaa mabtalaahu faqadara 'alaihi rizqahoo fa yaqoolu Rabbeee ahaanan", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6009.mp3"}, {"n": 17, "ar": "كَلَّا ۖ بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ", "en": "No! But you do not honor the orphan", "tl": "Kalla bal laa tukrimooo nal yateem", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6010.mp3"}, {"n": 18, "ar": "وَلَا تَحَٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ", "en": "And you do not encourage one another to feed the poor.", "tl": "Wa laa tahaaaddoona 'alaata'aamil miskeen", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6011.mp3"}, {"n": 19, "ar": "وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًۭا لَّمًّۭا", "en": "And you consume inheritance, devouring [it] altogether,", "tl": "Wa taakuloonat turaasa aklal lammaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6012.mp3"}, {"n": 20, "ar": "وَتُحِبُّونَ ٱلْمَالَ حُبًّۭا جَمًّۭا", "en": "And you love wealth with immense love.", "tl": "Wa tuhibboonal maala hubban jammaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6013.mp3"}, {"n": 21, "ar": "كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا", "en": "No! When the earth has been leveled - pounded and crushed -", "tl": "Kallaaa izaaa dukkatil ardu dakkan dakka", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6014.mp3"}, {"n": 22, "ar": "وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّۭا صَفًّۭا", "en": "And your Lord has come and the angels, rank upon rank,", "tl": "Wa jaaa'a Rabbuka wal malaku saffan saffaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6015.mp3"}, {"n": 23, "ar": "وَجِا۟ىٓءَ يَوْمَئِذٍۭ بِجَهَنَّمَ ۚ يَوْمَئِذٍۢ يَتَذَكَّرُ ٱلْإِنسَٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ", "en": "And brought [within view], that Day, is Hell - that Day, man will remember, but what good to him will be the remembrance?", "tl": "Wa jeee'a yawma'izim bi jahannnam; Yawma 'iziny yatazakkarul insaanu wa annaa lahuz zikraa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6016.mp3"}, {"n": 24, "ar": "يَقُولُ يَٰلَيْتَنِى قَدَّمْتُ لِحَيَاتِى", "en": "He will say, \"Oh, I wish I had sent ahead [some good] for my life.\"", "tl": "Yaqoolu yaa laitanee qaddamtu lihayaatee", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6017.mp3"}, {"n": 25, "ar": "فَيَوْمَئِذٍۢ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌۭ", "en": "So on that Day, none will punish [as severely] as His punishment,", "tl": "Fa Yawma izil laa yu'azzibu 'azaabahooo ahad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6018.mp3"}, {"n": 26, "ar": "وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌۭ", "en": "And none will bind [as severely] as His binding [of the evildoers].", "tl": "Wa laa yoosiqu wasaaqa hooo ahad", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6019.mp3"}, {"n": 27, "ar": "يَٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ", "en": "[To the righteous it will be said], \"O reassured soul,", "tl": "Yaaa ayyatuhan nafsul mutma 'innah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6020.mp3"}, {"n": 28, "ar": "ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةًۭ مَّرْضِيَّةًۭ", "en": "Return to your Lord, well-pleased and pleasing [to Him],", "tl": "Irji'eee ilaa Rabbiki raadiyatam mardiyyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6021.mp3"}, {"n": 29, "ar": "فَٱدْخُلِى فِى عِبَٰدِى", "en": "And enter among My [righteous] servants", "tl": "Fadkhulee fee 'ibaadee", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6022.mp3"}, {"n": 30, "ar": "وَٱدْخُلِى جَنَّتِى", "en": "And enter My Paradise.\"", "tl": "Wadkhulee jannatee", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/6023.mp3"}]}, {"number": 88, "arabicName": "سُورَةُ الغَاشِيَةِ", "englishName": "Al-Ghashiyah", "meaning": "The Overwhelming", "term": 1, "badge": "🌊", "ayahCount": 26, "ayahs": [{"n": 1, "ar": "هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَٰشِيَةِ", "en": "Has there reached you the report of the Overwhelming [event]?", "tl": "Hal ataaka hadeesul ghaashiyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5968.mp3"}, {"n": 2, "ar": "وُجُوهٌۭ يَوْمَئِذٍ خَٰشِعَةٌ", "en": "[Some] faces, that Day, will be humbled,", "tl": "Wujoohuny yawma 'izin khaashi'ah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5969.mp3"}, {"n": 3, "ar": "عَامِلَةٌۭ نَّاصِبَةٌۭ", "en": "Working [hard] and exhausted.", "tl": "'Aamilatun naasibah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5970.mp3"}, {"n": 4, "ar": "تَصْلَىٰ نَارًا حَامِيَةًۭ", "en": "They will [enter to] burn in an intensely hot Fire.", "tl": "Taslaa naaran haamiyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5971.mp3"}, {"n": 5, "ar": "تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍۢ", "en": "They will be given drink from a boiling spring.", "tl": "Tusqaa min 'aynin aaniyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5972.mp3"}, {"n": 6, "ar": "لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍۢ", "en": "For them there will be no food except from a poisonous, thorny plant", "tl": "Laisa lahum ta'aamun illaa min daree'", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5973.mp3"}, {"n": 7, "ar": "لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍۢ", "en": "Which neither nourishes nor avails against hunger.", "tl": "Laa yusminu wa laa yughnee min joo'", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5974.mp3"}, {"n": 8, "ar": "وُجُوهٌۭ يَوْمَئِذٍۢ نَّاعِمَةٌۭ", "en": "[Other] faces, that Day, will show pleasure.", "tl": "Wujoohuny yawma 'izin naa'imah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5975.mp3"}, {"n": 9, "ar": "لِّسَعْيِهَا رَاضِيَةٌۭ", "en": "With their effort [they are] satisfied", "tl": "Lisa'yihaa raadiyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5976.mp3"}, {"n": 10, "ar": "فِى جَنَّةٍ عَالِيَةٍۢ", "en": "In an elevated garden,", "tl": "Fee jannatin 'aaliyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5977.mp3"}, {"n": 11, "ar": "لَّا تَسْمَعُ فِيهَا لَٰغِيَةًۭ", "en": "Wherein they will hear no unsuitable speech.", "tl": "Laa tasma'u feehaa laaghiyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5978.mp3"}, {"n": 12, "ar": "فِيهَا عَيْنٌۭ جَارِيَةٌۭ", "en": "Within it is a flowing spring.", "tl": "Feehaa 'aynun jaariyah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5979.mp3"}, {"n": 13, "ar": "فِيهَا سُرُرٌۭ مَّرْفُوعَةٌۭ", "en": "Within it are couches raised high", "tl": "Feehaa sururum marfoo'ah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5980.mp3"}, {"n": 14, "ar": "وَأَكْوَابٌۭ مَّوْضُوعَةٌۭ", "en": "And cups put in place", "tl": "Wa akwaabum mawdoo 'ah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5981.mp3"}, {"n": 15, "ar": "وَنَمَارِقُ مَصْفُوفَةٌۭ", "en": "And cushions lined up", "tl": "Wa namaariqu masfoofah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5982.mp3"}, {"n": 16, "ar": "وَزَرَابِىُّ مَبْثُوثَةٌ", "en": "And carpets spread around.", "tl": "Wa zaraabiyyu mabsoosah", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5983.mp3"}, {"n": 17, "ar": "أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ", "en": "Then do they not look at the camels - how they are created?", "tl": "Afalaa yanzuroona ilalibili kaifa khuliqat", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5984.mp3"}, {"n": 18, "ar": "وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ", "en": "And at the sky - how it is raised?", "tl": "Wa ilas samaaa'i kaifa rufi'at", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5985.mp3"}, {"n": 19, "ar": "وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ", "en": "And at the mountains - how they are erected?", "tl": "Wa ilal jibaali kaifa nusibat", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5986.mp3"}, {"n": 20, "ar": "وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ", "en": "And at the earth - how it is spread out?", "tl": "Wa ilal ardi kaifa sutihat", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5987.mp3"}, {"n": 21, "ar": "فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌۭ", "en": "So remind, [O Muhammad]; you are only a reminder.", "tl": "Fazakkir innama anta Muzakkir", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5988.mp3"}, {"n": 22, "ar": "لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ", "en": "You are not over them a controller.", "tl": "Lasta 'alaihim bimusaitir", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5989.mp3"}, {"n": 23, "ar": "إِلَّا مَن تَوَلَّىٰ وَكَفَرَ", "en": "However, he who turns away and disbelieves -", "tl": "Illaa man tawallaa wa kafar", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5990.mp3"}, {"n": 24, "ar": "فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ", "en": "Then Allah will punish him with the greatest punishment.", "tl": "Fa yu'azzibuhul laahul 'azaabal akbar", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5991.mp3"}, {"n": 25, "ar": "إِنَّ إِلَيْنَآ إِيَابَهُمْ", "en": "Indeed, to Us is their return.", "tl": "Innaa ilainaaa iyaabahum", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5992.mp3"}, {"n": 26, "ar": "ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم", "en": "Then indeed, upon Us is their account.", "tl": "Summa inna 'alainaa hisaabahum", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5993.mp3"}]}, {"number": 87, "arabicName": "سُورَةُ الأَعۡلَىٰ", "englishName": "Al-A'la", "meaning": "The Most High", "term": 1, "badge": "🌌", "ayahCount": 19, "ayahs": [{"n": 1, "ar": "سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى", "en": "Exalt the name of your Lord, the Most High,", "tl": "Sabbihisma Rabbikal A'laa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5949.mp3"}, {"n": 2, "ar": "ٱلَّذِى خَلَقَ فَسَوَّىٰ", "en": "Who created and proportioned", "tl": "Allazee khalaqa fasawwaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5950.mp3"}, {"n": 3, "ar": "وَٱلَّذِى قَدَّرَ فَهَدَىٰ", "en": "And who destined and [then] guided", "tl": "Wallazee qaddara fahadaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5951.mp3"}, {"n": 4, "ar": "وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ", "en": "And who brings out the pasture", "tl": "Wallazeee akhrajal mar'aa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5952.mp3"}, {"n": 5, "ar": "فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ", "en": "And [then] makes it black stubble.", "tl": "Faja'alahoo ghusaaa'an ahwaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5953.mp3"}, {"n": 6, "ar": "سَنُقْرِئُكَ فَلَا تَنسَىٰٓ", "en": "We will make you recite, [O Muhammad], and you will not forget,", "tl": "Sanuqri'uka falaa tansaaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5954.mp3"}, {"n": 7, "ar": "إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ", "en": "Except what Allah should will. Indeed, He knows what is declared and what is hidden.", "tl": "Illaa maa shaaa'al laah; innahoo ya'lamul jahra wa maa yakhfaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5955.mp3"}, {"n": 8, "ar": "وَنُيَسِّرُكَ لِلْيُسْرَىٰ", "en": "And We will ease you toward ease.", "tl": "Wa nu-yassiruka lilyusraa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5956.mp3"}, {"n": 9, "ar": "فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ", "en": "So remind, if the reminder should benefit;", "tl": "Fazakkir in nafa'atizzikraa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5957.mp3"}, {"n": 10, "ar": "سَيَذَّكَّرُ مَن يَخْشَىٰ", "en": "He who fears [Allah] will be reminded.", "tl": "Sa yazzakkaru maiyakhshaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5958.mp3"}, {"n": 11, "ar": "وَيَتَجَنَّبُهَا ٱلْأَشْقَى", "en": "But the wretched one will avoid it -", "tl": "Wa yatajannabuhal ashqaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5959.mp3"}, {"n": 12, "ar": "ٱلَّذِى يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ", "en": "[He] who will [enter and] burn in the greatest Fire,", "tl": "Allazee yaslan Naaral kubraa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5960.mp3"}, {"n": 13, "ar": "ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ", "en": "Neither dying therein nor living.", "tl": "Summa laa yamootu feehaa wa laa yahyaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5961.mp3"}, {"n": 14, "ar": "قَدْ أَفْلَحَ مَن تَزَكَّىٰ", "en": "He has certainly succeeded who purifies himself", "tl": "Qad aflaha man tazakkaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5962.mp3"}, {"n": 15, "ar": "وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ", "en": "And mentions the name of his Lord and prays.", "tl": "Wa zakaras ma Rabbihee fasallaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5963.mp3"}, {"n": 16, "ar": "بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا", "en": "But you prefer the worldly life,", "tl": "Bal tu'siroonal hayaatad dunyaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5964.mp3"}, {"n": 17, "ar": "وَٱلْءَاخِرَةُ خَيْرٌۭ وَأَبْقَىٰٓ", "en": "While the Hereafter is better and more enduring.", "tl": "Wal Aakhiratu khairunw wa abqaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5965.mp3"}, {"n": 18, "ar": "إِنَّ هَٰذَا لَفِى ٱلصُّحُفِ ٱلْأُولَىٰ", "en": "Indeed, this is in the former scriptures,", "tl": "Inna haazaa lafis suhu fil oolaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5966.mp3"}, {"n": 19, "ar": "صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ", "en": "The scriptures of Abraham and Moses.", "tl": "Suhufi Ibraaheema wa Moosaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5967.mp3"}]}, {"number": 86, "arabicName": "سُورَةُ الطَّارِقِ", "englishName": "At-Tariq", "meaning": "The Morning Star", "term": 2, "badge": "⭐", "ayahCount": 17, "ayahs": [{"n": 1, "ar": "وَٱلسَّمَآءِ وَٱلطَّارِقِ", "en": "By the sky and the night comer -", "tl": "Wassamaaa'i wattaariq", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5932.mp3"}, {"n": 2, "ar": "وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ", "en": "And what can make you know what is the night comer?", "tl": "Wa maaa adraaka mattaariq", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5933.mp3"}, {"n": 3, "ar": "ٱلنَّجْمُ ٱلثَّاقِبُ", "en": "It is the piercing star -", "tl": "Annajmus saaqib", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5934.mp3"}, {"n": 4, "ar": "إِن كُلُّ نَفْسٍۢ لَّمَّا عَلَيْهَا حَافِظٌۭ", "en": "There is no soul but that it has over it a protector.", "tl": "In kullu nafsil lammaa 'alaihaa haafiz", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5935.mp3"}, {"n": 5, "ar": "فَلْيَنظُرِ ٱلْإِنسَٰنُ مِمَّ خُلِقَ", "en": "So let man observe from what he was created.", "tl": "Fal yanzuril insaanu mimma khuliq", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5936.mp3"}, {"n": 6, "ar": "خُلِقَ مِن مَّآءٍۢ دَافِقٍۢ", "en": "He was created from a fluid, ejected,", "tl": "Khuliqa mim maaa'in daafiq", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5937.mp3"}, {"n": 7, "ar": "يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ", "en": "Emerging from between the backbone and the ribs.", "tl": "Yakhruju mim bainissulbi wat taraaa'ib", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5938.mp3"}, {"n": 8, "ar": "إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌۭ", "en": "Indeed, Allah, to return him [to life], is Able.", "tl": "Innahoo 'alaa raj'ihee laqaadir", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5939.mp3"}, {"n": 9, "ar": "يَوْمَ تُبْلَى ٱلسَّرَآئِرُ", "en": "The Day when secrets will be put on trial,", "tl": "Yawma tublas saraaa'ir", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5940.mp3"}, {"n": 10, "ar": "فَمَا لَهُۥ مِن قُوَّةٍۢ وَلَا نَاصِرٍۢ", "en": "Then man will have no power or any helper.", "tl": "Famaa lahoo min quwwatinw wa laa naasir", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5941.mp3"}, {"n": 11, "ar": "وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ", "en": "By the sky which returns [rain]", "tl": "Wassamaaa'i zaatir raj'", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5942.mp3"}, {"n": 12, "ar": "وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ", "en": "And [by] the earth which cracks open,", "tl": "Wal ardi zaatis sad'", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5943.mp3"}, {"n": 13, "ar": "إِنَّهُۥ لَقَوْلٌۭ فَصْلٌۭ", "en": "Indeed, the Qur'an is a decisive statement,", "tl": "Innahoo laqawlun fasl", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5944.mp3"}, {"n": 14, "ar": "وَمَا هُوَ بِٱلْهَزْلِ", "en": "And it is not amusement.", "tl": "Wa maa huwa bil hazl", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5945.mp3"}, {"n": 15, "ar": "إِنَّهُمْ يَكِيدُونَ كَيْدًۭا", "en": "Indeed, they are planning a plan,", "tl": "Innahum yakeedoona kaidaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5946.mp3"}, {"n": 16, "ar": "وَأَكِيدُ كَيْدًۭا", "en": "But I am planning a plan.", "tl": "Wa akeedu kaidaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5947.mp3"}, {"n": 17, "ar": "فَمَهِّلِ ٱلْكَٰفِرِينَ أَمْهِلْهُمْ رُوَيْدًۢا", "en": "So allow time for the disbelievers. Leave them awhile.", "tl": "Famahhilil kaafireena amhilhum ruwaidaa", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5948.mp3"}]}, {"number": 85, "arabicName": "سُورَةُ البُرُوجِ", "englishName": "Al-Buruj", "meaning": "The Constellations", "term": 2, "badge": "🌠", "ayahCount": 22, "ayahs": [{"n": 1, "ar": "وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ", "en": "By the sky containing great stars", "tl": "Wassamaaa'i zaatil burooj", "audio": "https://cdn.islamic.network/quran/audio/128/ar.alafasy/5910.mp3"}, {"n": 2, "ar": "وَٱلْيَوْمِ ٱلْمَوْعُودِ", "en": "And [by] the promised Day", "tl": "Wal yawmil maw'ood", "audio": "https://cdn.isla const PROGRESS_KEY = 'hafazan_progress_v1';
const BATCH_SIZE = 5;

function loadProgress(){
  try{
    return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
}
let progress = loadProgress();

function getBatches(surah){
  const batches = [];
  for(let i=0;i<surah.ayahs.length;i+=BATCH_SIZE){
    batches.push(surah.ayahs.slice(i, i+BATCH_SIZE));
  }
  return batches;
}
function isBatchConfirmed(surahNum, batchIdx){
  return !!(progress[surahNum] && progress[surahNum].confirmed && progress[surahNum].confirmed[batchIdx]);
}
function confirmBatch(surahNum, batchIdx){
  if(!progress[surahNum]) progress[surahNum] = {confirmed:{}};
  if(!progress[surahNum].confirmed) progress[surahNum].confirmed = {};
  progress[surahNum].confirmed[batchIdx] = true;
  saveProgress(progress);
}
function surahConfirmedCount(surah){
  const batches = getBatches(surah);
  let c = 0;
  for(let i=0;i<batches.length;i++) if(isBatchConfirmed(surah.number,i)) c++;
  return c;
}
function isSurahComplete(surah){
  return surahConfirmedCount(surah) === getBatches(surah).length;
}
function firstUnlockedBatch(surah){
  const batches = getBatches(surah);
  for(let i=0;i<batches.length;i++){
    if(!isBatchConfirmed(surah.number,i)) return i;
  }
  return batches.length - 1; // all done, point to last
}

// ---------------- state ----------------
let state = { view:'home', surahNumber:null, batchIdx:0, ayahIdx:0, showTranslit:false };

const audioEl = new Audio();
let audioQueue = [];
const MAX_REPEATS = 9;
let repeatState = { active:false, count:0, url:null };

function rawPlay(url){
  audioEl.pause();
  audioEl.src = url;
  audioEl.play().catch(()=>{});
}
function stopRepeat(){
  repeatState.active = false;
  repeatState.count = 0;
  repeatState.url = null;
}
function playSingle(url){
  // Explicit single play (e.g. Listen button) always cancels any repeat/chain in progress
  stopRepeat();
  audioQueue = [];
  rawPlay(url);
}
function playChain(urls){
  stopRepeat();
  audioQueue = urls.slice(1);
  rawPlay(urls[0]);
}
function toggleRepeat(url){
  if(repeatState.active){
    // pressing Repeat again stops it immediately
    stopRepeat();
    audioEl.pause();
    render();
    return;
  }
  audioQueue = [];
  repeatState.active = true;
  repeatState.count = 1;
  repeatState.url = url;
  rawPlay(url);
  render();
}
audioEl.addEventListener('ended', ()=>{
  if(audioQueue.length){
    const next = audioQueue.shift();
    rawPlay(next);
    return;
  }
  if(repeatState.active){
    if(repeatState.count < MAX_REPEATS){
      repeatState.count++;
      rawPlay(repeatState.url);
    } else {
      stopRepeat();
      render();
    }
  }
});

function getSurah(num){ return QURAN_DATA.find(s => s.number === num); }

function goHome(){ stopRepeat(); audioEl.pause(); state = {view:'home', surahNumber:null, batchIdx:0, ayahIdx:0, showTranslit:false}; render(); }
function openSurah(num){ stopRepeat(); audioEl.pause(); state.view='batchList'; state.surahNumber=num; render(); }
function openBatch(num, idx){
  stopRepeat(); audioEl.pause();
  state.view='learn'; state.surahNumber=num; state.batchIdx=idx; state.ayahIdx=0; state.showTranslit=false;
  render();
}
function openCheck(){ stopRepeat(); audioEl.pause(); state.view='check'; state.showTranslit=false; render(); }

function nextAyah(){
  stopRepeat();
  audioEl.pause();
  const surah = getSurah(state.surahNumber);
  const batch = getBatches(surah)[state.batchIdx];
  if(state.ayahIdx < batch.length - 1){
    state.ayahIdx++;
    render();
  } else {
    openCheck();
  }
}
function prevAyah(){
  stopRepeat();
  audioEl.pause();
  if(state.ayahIdx === 0){
    state.view = 'batchList';
    render();
  } else {
    state.ayahIdx--;
    render();
  }
}

function handleGoodRecitation(){
  const surah = getSurah(state.surahNumber);
  confirmBatch(surah.number, state.batchIdx);
  const nowComplete = isSurahComplete(surah);
  showCelebration(surah, nowComplete);
}
function handleNeedsPractice(){
  state.view = 'learn';
  state.ayahIdx = 0;
  state.showTranslit = false;
  render();
  showToast("No worries — let's go through it once more together. 💛");
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function getParentPin(){ return localStorage.getItem('hafazan_parent_pin'); }
function setParentPinValue(pin){ localStorage.setItem('hafazan_parent_pin', pin); }

function showParentGate(onSuccess){
  const existing = getParentPin();
  const isNew = !existing;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="celebration-card">
      <div class="celebration-emoji">🔐</div>
      <div class="celebration-title">${isNew ? 'Set a parent PIN' : 'Parent PIN'}</div>
      <div class="celebration-sub">${isNew ? 'Create a 4-digit PIN so only a parent can confirm a recitation from now on.' : 'Enter the parent PIN to confirm this batch.'}</div>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pin-input" class="pin-input" placeholder="••••" autocomplete="off">
      <div class="pin-error" id="pin-error"></div>
      <button class="btn btn-primary" id="pin-submit">${isNew ? 'Set PIN & Confirm' : 'Confirm'}</button>
      <button class="btn btn-ghost" id="pin-cancel">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#pin-input');
  const errorEl = overlay.querySelector('#pin-error');
  input.focus();
  overlay.querySelector('#pin-submit').onclick = ()=>{
    const val = input.value.trim();
    if(!/^\d{4}$/.test(val)){
      errorEl.textContent = 'Enter a 4-digit PIN.';
      return;
    }
    if(isNew){
      setParentPinValue(val);
      overlay.remove();
      onSuccess();
    } else if(val === existing){
      overlay.remove();
      onSuccess();
    } else {
      errorEl.textContent = 'Incorrect PIN. Try again.';
      input.value = '';
      input.focus();
    }
  };
  overlay.querySelector('#pin-cancel').onclick = ()=>{ overlay.remove(); };
}

function showPinSettings(){
  const existing = getParentPin();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="celebration-card">
      <div class="celebration-emoji">🔐</div>
      <div class="celebration-title">Parent PIN Settings</div>
      <div class="celebration-sub">${existing ? 'Enter your current PIN, then a new one, to change it.' : 'Set a 4-digit PIN. You will need it to confirm each recitation.'}</div>
      ${existing ? '<input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="old-pin-input" class="pin-input" placeholder="Current PIN" autocomplete="off">' : ''}
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="new-pin-input" class="pin-input" placeholder="New PIN" autocomplete="off">
      <div class="pin-error" id="pin-error"></div>
      <button class="btn btn-primary" id="pin-save">Save</button>
      <button class="btn btn-ghost" id="pin-cancel">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  const errorEl = overlay.querySelector('#pin-error');
  overlay.querySelector('#pin-save').onclick = ()=>{
    if(existing){
      const oldVal = overlay.querySelector('#old-pin-input').value.trim();
      if(oldVal !== existing){
        errorEl.textContent = 'Current PIN is incorrect.';
        return;
      }
    }
    const newVal = overlay.querySelector('#new-pin-input').value.trim();
    if(!/^\d{4}$/.test(newVal)){
      errorEl.textContent = 'New PIN must be 4 digits.';
      return;
    }
    setParentPinValue(newVal);
    overlay.remove();
    showToast('Parent PIN saved. 🔐');
  };
  overlay.querySelector('#pin-cancel').onclick = ()=>{ overlay.remove(); };
}

function showCelebration(surah, surahComplete){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  let emoji = '⭐';
  let title = 'Batch complete!';
  let sub = 'Great work listening and reciting carefully.';
  if(surahComplete){
    emoji = surah.badge;
    title = `${surah.englishName} unlocked!`;
    sub = `"${surah.meaning}" — added to your galaxy. Masha'Allah!`;
  }
  overlay.innerHTML = `
    <div class="celebration-card">
      <div class="celebration-emoji">${emoji}</div>
      <div class="celebration-title">${title}</div>
      <div class="celebration-sub">${sub}</div>
      <button class="btn btn-primary" id="celeb-ok">Continue</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('celeb-ok').onclick = ()=>{
    overlay.remove();
    state.view = 'batchList';
    render();
  };
}

function toggleTranslit(){ state.showTranslit = !state.showTranslit; render(); }

// ---------------- render ----------------
function render(){
  const app = document.getElementById('app');
  if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'batchList') app.innerHTML = renderBatchList();
  else if(state.view === 'learn') app.innerHTML = renderLearn();
  else if(state.view === 'check') app.innerHTML = renderCheck();
  attachHandlers();
}

function renderHome(){
  const term1 = QURAN_DATA.filter(s=>s.term===1);
  const term2 = QURAN_DATA.filter(s=>s.term===2);
  const term3 = QURAN_DATA.filter(s=>s.term===3);
  let totalStars = 0, totalBatches = 0, planets = 0;
  QURAN_DATA.forEach(s=>{
    totalStars += surahConfirmedCount(s);
    totalBatches += getBatches(s).length;
    if(isSurahComplete(s)) planets++;
  });

  function surahCard(s){
    const batches = getBatches(s);
    const done = surahConfirmedCount(s);
    const pct = Math.round((done/batches.length)*100);
    const complete = done === batches.length;
    return `
      <div class="surah-card ${complete?'complete':''}" data-open-surah="${s.number}">
        <div class="surah-badge">${s.badge}</div>
        <div class="surah-info">
          <div class="surah-names">
            <span class="surah-en">${s.englishName}</span>
            <span class="surah-ar arabic">${s.arabicName}</span>
          </div>
          <div class="surah-meaning">"${s.meaning}" · ${s.ayahCount} ayah</div>
          <div class="progress-row">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label">${done}/${batches.length} ${complete?'⭐ done':''}</div>
          </div>
        </div>
        <div class="surah-arrow">›</div>
      </div>`;
  }

  return `
    <div class="top-header">
      <div class="greeting">Assalamualaikum 🌙<span class="sub">Your Hafazan Journey</span></div>
      <button class="settings-btn" id="parent-settings-btn" title="Parent settings">⚙️</button>
    </div>
    <div class="term-block">
      <div class="term-title">Term 1</div>
      ${term1.map(surahCard).join('')}
    </div>
    <div class="term-block">
      <div class="term-title">Term 2</div>
      ${term2.map(surahCard).join('')}
    </div>
    <div class="term-block">
      <div class="term-title">More Surahs</div>
      ${term3.map(surahCard).join('')}
    </div>
    <div class="galaxy-box">
      <h3>Your Galaxy</h3>
      <div class="galaxy-row">
        <div class="galaxy-stat"><div class="num">⭐ ${totalStars}</div><div class="lab">Stars</div></div>
        <div class="galaxy-stat"><div class="num">🪐 ${planets}</div><div class="lab">Surahs unlocked</div></div>
        <div class="galaxy-stat"><div class="num">${totalBatches - totalStars}</div><div class="lab">Batches to go</div></div>
      </div>
    </div>
    <div class="footnote">Listen, repeat, then recite each batch to a parent to earn your star.</div>
  `;
}

function renderBatchList(){
  const surah = getSurah(state.surahNumber);
  const batches = getBatches(surah);
  const unlocked = firstUnlockedBatch(surah);
  const rows = batches.map((batch, idx)=>{
    const confirmed = isBatchConfirmed(surah.number, idx);
    const isUnlocked = idx <= unlocked;
    const from = batch[0].n, to = batch[batch.length-1].n;
    let iconClass = 'locked-icon', icon = '🔒';
    if(confirmed){ iconClass='done'; icon='⭐'; }
    else if(isUnlocked){ iconClass='current'; icon='▶'; }
    return `
      <div class="batch-row ${isUnlocked?'':'locked'}" ${isUnlocked?`data-open-batch="${idx}"`:''}>
        <div class="batch-icon ${iconClass}">${icon}</div>
        <div class="batch-text">
          <div class="label">Batch ${idx+1}</div>
          <div class="range">Ayah ${from}–${to}</div>
        </div>
        ${isUnlocked ? `<div class="batch-cta">${confirmed?'Review':'Start'}</div>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="screen-bar">
      <button class="back-btn" data-go="home">‹</button>
      <div class="screen-title">
        <h2>${surah.englishName} <span class="arabic">${surah.arabicName}</span></h2>
        <div class="sub">${surah.meaning} · ${batches.length} batches</div>
      </div>
    </div>
    ${rows}
  `;
}

function renderLearn(){
  const surah = getSurah(state.surahNumber);
  const batch = getBatches(surah)[state.batchIdx];
  const ayah = batch[state.ayahIdx];
  const isLast = state.ayahIdx === batch.length - 1;

  const dots = batch.map((_,i)=>{
    let cls = 'dot';
    if(i === state.ayahIdx) cls += ' active';
    else if(i < state.ayahIdx) cls += ' done';
    return `<div class="${cls}"></div>`;
  }).join('');

  const chainBtn = state.ayahIdx > 0 ? `
    <button class="btn btn-toggle" id="chain-btn">🔁 Practice ayah ${batch[0].n}–${ayah.n} together</button>
  ` : '';

  return `
    <div class="screen-bar">
      <button class="back-btn" data-go="batchList">‹</button>
      <div class="screen-title">
        <h2>${surah.englishName} · Batch ${state.batchIdx+1}</h2>
        <div class="sub">Ayah ${state.ayahIdx+1} of ${batch.length}</div>
      </div>
    </div>
    <div class="dots-row">${dots}</div>
    <div class="ayah-card">
      <div class="ayah-chip">Ayah ${ayah.n}</div>
      <div class="ayah-arabic arabic">${ayah.ar}</div>
      ${state.showTranslit ? `<div class="ayah-translit">${ayah.tl}</div>` : ''}
      <div class="ayah-en">${ayah.en}</div>
    </div>
    <button class="btn btn-primary" id="play-btn">▶ Listen</button>
    <button class="btn ${repeatState.active ? 'btn-repeat-active' : 'btn-toggle'}" id="repeat-btn">${repeatState.active ? `⏹ Stop repeat (${repeatState.count}/${MAX_REPEATS})` : '🔂 Repeat (up to 9x)'}</button>
    <button class="btn btn-secondary" id="translit-btn">${state.showTranslit ? 'Hide' : 'Show'} pronunciation help</button>
    ${chainBtn}
    <div class="nav-row">
      <button class="btn btn-secondary" id="back-ayah-btn">◀ Back</button>
      <button class="btn btn-primary" id="next-ayah-btn">${isLast ? 'Finish batch ✅' : 'Next ▶'}</button>
    </div>
  `;
}

function renderCheck(){
  const surah = getSurah(state.surahNumber);
  const batch = getBatches(surah)[state.batchIdx];

  const miniAyahs = batch.map(ayah => `
    <div class="mini-ayah">
      <div class="top-row">
        <span class="n">Ayah ${ayah.n}</span>
        <button class="mini-play" data-play="${ayah.audio}">▶</button>
      </div>
      <div class="ayah-arabic arabic">${ayah.ar}</div>
      ${state.showTranslit ? `<div class="ayah-translit">${ayah.tl}</div>` : ''}
      <div class="ayah-en">${ayah.en}</div>
    </div>
  `).join('');

  return `
    <div class="screen-bar">
      <button class="back-btn" data-go="learn-last">‹</button>
      <div class="screen-title">
        <h2>Recitation Check</h2>
        <div class="sub">${surah.englishName} · Batch ${state.batchIdx+1}</div>
      </div>
    </div>
    <div class="instruction-box">🎤 Recite this whole batch to a parent, from memory — no peeking!</div>
    <button class="btn btn-secondary" id="translit-btn">${state.showTranslit ? 'Hide' : 'Show'} pronunciation help</button>
    <button class="btn btn-toggle" id="play-all-btn">▶ Play whole batch</button>
    ${miniAyahs}
    <div style="margin-top:18px;">
      <button class="btn btn-success" id="good-btn">✅ He recited it well</button>
      <button class="btn btn-warn" id="practice-btn">🔁 Needs more practice</button>
    </div>
  `;
}

function attachHandlers(){
  document.querySelectorAll('[data-go]').forEach(el=>{
    el.onclick = ()=>{
      const target = el.getAttribute('data-go');
      if(target === 'home') goHome();
      else if(target === 'batchList') { state.view='batchList'; render(); }
      else if(target === 'learn-last') {
        const surah = getSurah(state.surahNumber);
        const batch = getBatches(surah)[state.batchIdx];
        state.view='learn'; state.ayahIdx = batch.length-1; render();
      }
    };
  });
  document.querySelectorAll('[data-open-surah]').forEach(el=>{
    el.onclick = ()=> openSurah(parseInt(el.getAttribute('data-open-surah'),10));
  });
  document.querySelectorAll('[data-open-batch]').forEach(el=>{
    el.onclick = ()=> openBatch(state.surahNumber, parseInt(el.getAttribute('data-open-batch'),10));
  });
  const playBtn = document.getElementById('play-btn');
  if(playBtn) playBtn.onclick = ()=>{
    const surah = getSurah(state.surahNumber);
    const batch = getBatches(surah)[state.batchIdx];
    playSingle(batch[state.ayahIdx].audio);
  };
  const chainBtn = document.getElementById('chain-btn');
  if(chainBtn) chainBtn.onclick = ()=>{
    const surah = getSurah(state.surahNumber);
    const batch = getBatches(surah)[state.batchIdx];
    const urls = batch.slice(0, state.ayahIdx+1).map(a=>a.audio);
    playChain(urls);
  };
  const repeatBtn = document.getElementById('repeat-btn');
  if(repeatBtn) repeatBtn.onclick = ()=>{
    const surah = getSurah(state.surahNumber);
    const batch = getBatches(surah)[state.batchIdx];
    toggleRepeat(batch[state.ayahIdx].audio);
  };
  const translitBtn = document.getElementById('translit-btn');
  if(translitBtn) translitBtn.onclick = toggleTranslit;
  const backAyahBtn = document.getElementById('back-ayah-btn');
  if(backAyahBtn) backAyahBtn.onclick = prevAyah;
  const nextAyahBtn = document.getElementById('next-ayah-btn');
  if(nextAyahBtn) nextAyahBtn.onclick = nextAyah;
  const playAllBtn = document.getElementById('play-all-btn');
  if(playAllBtn) playAllBtn.onclick = ()=>{
    const surah = getSurah(state.surahNumber);
    const batch = getBatches(surah)[state.batchIdx];
    playChain(batch.map(a=>a.audio));
  };
  document.querySelectorAll('[data-play]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); playSingle(el.getAttribute('data-play')); };
  });
  const goodBtn = document.getElementById('good-btn');
  if(goodBtn) goodBtn.onclick = ()=> showParentGate(handleGoodRecitation);
  const settingsBtn = document.getElementById('parent-settings-btn');
  if(settingsBtn) settingsBtn.onclick = showPinSettings;
  const practiceBtn = document.getElementById('practice-btn');
  if(practiceBtn) practiceBtn.onclick = handleNeedsPractice;
}

render();
</script>
</body>
</html>
